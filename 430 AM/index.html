<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irfanul Haque Khan</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--black:#0a0a0a;--black-2:#111111;--black-3:#1a1a1a;--gold:#c9a84c;--gold-light:#e8c97a;--gold-dim:rgba(201,168,76,0.15);--white:#f0ece4;--white-dim:rgba(240,236,228,0.5);--white-faint:rgba(240,236,228,0.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--black);color:var(--white);font-family:'DM Mono',monospace;font-size:13px;height:100dvh;display:flex;overflow:hidden}
.sidebar{width:320px;background:var(--black-2);border-right:1px solid var(--white-faint);display:flex;flex-direction:column;padding:40px 30px;justify-content:space-between}
.profile-section{display:flex;flex-direction:column;gap:25px}
.avatar-container{width:90px;height:90px;border-radius:50%;border:1px solid var(--gold);overflow:hidden;background:var(--black-3)}
.avatar-container img{width:100%;height:100%;object-fit:cover;object-position:center top}
.profile-info h1{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:400;line-height:1.1;color:var(--white);margin-bottom:8px}
.profile-info p{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--gold)}
.nav-menu{display:flex;flex-direction:column;gap:15px;margin-top:40px}
.nav-item{font-size:12px;color:var(--white-dim);text-decoration:none;cursor:pointer;transition:color 0.2s;display:flex;align-items:center;gap:10px}
.nav-item:hover{color:var(--gold)}
.sidebar-footer{font-size:11px;color:var(--white-faint);line-height:1.6}
.sidebar-footer a{color:var(--gold);text-decoration:none;display:block;margin-top:4px}
.sidebar-footer a:hover{color:var(--gold-light)}
.chat-container{flex:1;display:flex;flex-direction:column;background:var(--black);position:relative}
.chat-messages{flex:1;overflow-y:auto;padding:50px 60px;display:flex;flex-direction:column;gap:35px;scroll-behavior:smooth}
.message{display:flex;gap:20px;max-width:800px;animation:fadeIn 0.3s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.message.user{align-self:flex-end;flex-direction:row-reverse}
.msg-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.msg-icon.irfan{border:1px solid var(--gold);overflow:hidden}
.msg-icon.irfan img{width:100%;height:100%;object-fit:cover;object-position:center top}
.msg-icon.user{background:var(--white-faint);color:var(--gold);border:1px solid var(--white-faint)}
.msg-body{display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 60px)}
.message.user .msg-body{align-items:flex-end}
.msg-bubble{padding:16px 20px;border-radius:4px;line-height:1.7;font-size:14px;white-space:pre-line}
.message.irfan .msg-bubble{background:var(--black-2);border:1px solid var(--white-faint);color:var(--white)}
.message.user .msg-bubble{background:var(--gold-dim);border:1px solid var(--gold);color:var(--gold-light)}
.msg-time{font-size:10px;color:var(--white-faint)}
.quick-prompts{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.prompt-btn{background:var(--black-3);border:1px solid var(--white-faint);color:var(--white-dim);padding:10px 16px;border-radius:4px;font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;transition:all 0.2s;text-transform:uppercase;letter-spacing:1px}
.prompt-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--black-2)}
.typing-dots{display:flex;align-items:center;gap:5px;padding:16px 20px;background:var(--black-2);border:1px solid var(--white-faint);border-radius:4px}
.typing-dots span{width:5px;height:5px;background:var(--gold);border-radius:50%;opacity:.4;animation:dot 1.2s ease-in-out infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.chat-input-container{padding:30px 60px 40px;background:linear-gradient(to top,var(--black) 80%,transparent)}
.input-wrapper{max-width:800px;margin:0 auto;position:relative;background:var(--black-2);border:1px solid var(--white-faint);border-radius:4px;display:flex;align-items:flex-end;transition:border-color 0.2s}
.input-wrapper:focus-within{border-color:var(--gold)}
.chat-textarea{flex:1;background:transparent;border:none;outline:none;color:var(--white);font-family:'DM Mono',monospace;font-size:14px;padding:16px 60px 16px 20px;resize:none;max-height:200px;line-height:1.5}
.send-btn{position:absolute;right:15px;bottom:12px;background:transparent;border:none;color:var(--white-dim);cursor:pointer;padding:5px;transition:color 0.2s}
.send-btn:hover{color:var(--gold)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--white-faint);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--gold-dim)}
@media(max-width:768px){body{flex-direction:column}.sidebar{width:100%;height:auto;padding:25px;border-right:none;border-bottom:1px solid var(--white-faint)}.nav-menu,.sidebar-footer{display:none}.chat-messages{padding:30px 20px}.chat-input-container{padding:15px 20px 25px}.msg-bubble{font-size:13px;padding:12px 16px}}
</style>
</head>

const STATIC = {
  about: "Based in Sharjah, UAE. Currently Head of E-Commerce and Brand at Gentle Park, a fashion retail company with 14 outlets across the UAE and 50+ in Bangladesh.\n\nBefore UAE I spent years on agency and brand side in Bangladesh, working across telecom, banking and FMCG. I work at the strategic level but stay close to execution because strategy without results is just a document.\n\nI have been across sales, digital, growth, advertising, finance, HR and procurement over the years. People who work with me often say it feels like having a co-founder without the equity ask.",
  do: "A jack of all trades is a master of none, but oftentimes better than a master of one.\n\nBrand strategy — positioning, identity, narrative, architecture.\nE-commerce — store launch, marketplace management, operations, pricing.\nPerformance marketing — Meta Ads, Google, paid social, audience strategy.\nDigital transformation — omnichannel planning, launch management, change.\n\nMost people come to me when they need one person who can hold the full picture. I treat your brand and budget like my own.",
  brands: "Brand side — Airtel Bangladesh, Robi Axiata, Banglalink, BRAC Bank, Gadget and Gear.\nAgency side — Nagad, Nestlé, Dettol, ACI, US Bangla Airlines.\nCurrently — Gentle Park UAE, Elozia, Gentle Park Bangladesh. Three brands, two markets, one strategy framework.",
  results: "Toffee x FIFA World Cup 2022 — Bangladesh's first mobile World Cup broadcast. 1 billion views. 15.5M unique viewers. 30 KOLs activated.\n\nNagad — two Gold awards at Digital Marketing Awards 2023.\n\nGadget and Gear — grew from BDT 1.4M to 7.5M in e-commerce. Outlet sales up 44%.\n\nGentle Park — e-commerce built from zero in 2026 across UAE. Bangladesh grew 338% year on year.\n\nBRAC Bank — first brand strategy in 5 years. 42% follower growth. 60%+ engagement in 18 months.\n\nBanglalink — launched Nextuber, Bangladesh's first digital reality show.",
  contact: "Open to freelance projects, consulting retainers and brand partnerships in the UAE or remote.\n\nIf you have something in mind, the best first step is a conversation.\n\nirfanulhk@gmail.com\n+971 50 311 2129\nlinkedin.com/in/irfan27"
};

const QUICK = [
  { label: 'About Me', prompt: 'About me' },
  { label: 'What Do I Do', prompt: 'What do you do' },
  { label: "Brands I've Worked With", prompt: 'Brands you have worked with' },
  { label: 'Contact Me', prompt: 'How can I work with you' }
];


let history = [];
let isTyping = false;

function getStaticKey(text) {
  const t = text.toLowerCase();
  if (t.includes('contact') || t.includes('hire') || t.includes('work with') || t.includes('how can') || t.includes('reach') || t.includes('email') || t.includes('linkedin')) return 'contact';
  if (t.includes('result') || t.includes('show me') || t.includes('achievement') || t.includes('number')) return 'results';
  if (t.includes('brand') || t.includes('client') || t.includes('worked with')) return 'brands';
  if (t.includes('service') || t.includes('what do') || t.includes('offer') || t.includes('what you')) return 'do';
  if (t.includes('about') || t.includes('who') || t.includes('background')) return 'about';
  return null;
}

function getTime() {
  return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

function scrollToBottom() {
  const msgs = document.getElementById('chatMessages');
  msgs.scrollTop = msgs.scrollHeight;
}

function makeIcon(role) {
  const icon = document.createElement('div');
  icon.className = `msg-icon ${role}`;
  if (role === 'irfan') {
    const img = document.createElement('img');
    img.src = PHOTO;
    icon.appendChild(img);
  } else {
    icon.textContent = 'You';
  }
  return icon;
}

function appendMessage(role, text, showButtons) {
  const msgs = document.getElementById('chatMessages');
  const wrap = document.createElement('div');
  wrap.className = `message ${role}`;
  const body = document.createElement('div');
  body.className = 'msg-body';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;
  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = getTime();
  body.appendChild(bubble);
  body.appendChild(time);
  if (showButtons) {
    const btns = document.createElement('div');
    btns.className = 'quick-prompts';
    QUICK.forEach(q => {
      const btn = document.createElement('button');
      btn.className = 'prompt-btn';
      btn.textContent = q.label;
      btn.onclick = () => sendPrompt(q.prompt);
      btns.appendChild(btn);
    });
    body.appendChild(btns);
  }
  wrap.appendChild(makeIcon(role));
  wrap.appendChild(body);
  msgs.appendChild(wrap);
  scrollToBottom();
}

function showTyping() {
  const msgs = document.getElementById('chatMessages');
  const wrap = document.createElement('div');
  wrap.className = 'message irfan';
  wrap.id = 'typingIndicator';
  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';
  wrap.appendChild(makeIcon('irfan'));
  wrap.appendChild(dots);
  msgs.appendChild(wrap);
  scrollToBottom();
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function getAIResponse(userMessage) {
  isTyping = true;
  history.push({ role: 'user', parts: [{ text: userMessage }] });
  showTyping();
  let reply = null;
  try {
    const res = await fetch('/.netlify/functions/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ systemInstruction: SYSTEM_PROMPT, contents: history })
    });
    const data = await res.json();
    if (data.text) reply = data.text;
  } catch(e) {}
  removeTyping();
  if (!reply) {
    const key = getStaticKey(userMessage);
    reply = key ? STATIC[key] : "Feel free to ask me about my background, services, brands I have worked with, results, or how to get in touch.";
  }
  history.push({ role: 'model', parts: [{ text: reply }] });
  appendMessage('irfan', reply);
  isTyping = false;
}

async function sendPrompt(text) {
  if (isTyping) return;
  appendMessage('user', text);
  await getAIResponse(text);
}

function handleSend() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || isTyping) return;
  input.value = '';
  input.style.height = 'auto';
  appendMessage('user', text);
  getAIResponse(text);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('sidebarPhoto').src = PHOTO;
  const opening = "Assalamu Alaikum and Hello, I am Irfan.\n\nI am an end-to-end operator specialising in Brand Strategy, E-Commerce, and Performance Marketing across the UAE and South Asia.\n\nPlease ask or select a question to get started.";
  setTimeout(() => appendMessage('irfan', opening, true), 400);
});
</script>
